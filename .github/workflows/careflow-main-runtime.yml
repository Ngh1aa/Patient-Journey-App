name: CareFlow patient journeys - required QA
on:
  push:
    branches: [main, feature/careflow-patient-journey-47]
  pull_request:
    paths: ['prototype/**', 'docs/**', 'design/**', '.github/workflows/careflow-main-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-project:
    name: 47 screens, F1-F12, Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test tools
        run: npm ci --prefix prototype --no-audit --no-fund
      - name: Install browser engines
        run: cd prototype && npx playwright install --with-deps chromium webkit
      - name: Serve pre-redesign baseline for before/after screenshots
        run: |
          git worktree add --detach /tmp/careflow-patient-before 095fda9ae6806d2e57a37faba10d5ab2af01e025
          PORT=4176 node /tmp/careflow-patient-before/prototype/preview-server.cjs > /tmp/careflow-patient-before.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4176/prototype/index.html > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4176/prototype/index.html > /dev/null
      - name: Syntax, model, actual-token contrast and browser acceptance
        run: npm --prefix prototype run test:all
      - name: Save route, exception and accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careflow-patient-journeys-${{ github.run_id }}
          path: |
            prototype/test-results/
            prototype/playwright-report/
          if-no-files-found: error
          retention-days: 14
