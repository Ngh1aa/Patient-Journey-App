# Manual compatibility entrypoint. Required PR/main gates live in careflow-main-runtime.yml.
name: CareFlow manual browser QA - careflow-browser-qa
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix prototype --no-audit --no-fund
      - run: cd prototype && npx playwright install --with-deps chromium webkit
      - run: npm --prefix prototype run test:all
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careflow-manual-${{ github.run_id }}
          path: |
            prototype/test-results/
            prototype/playwright-report/
          if-no-files-found: error
