name: Restore CareFlow staff portfolio source
on:
  push:
    branches:
      - design/careflow-clinic-core-8-portfolio
    paths:
      - 'staff-payload/ready'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore reviewed desktop assets
        shell: bash
        run: |
          set -euo pipefail
          cat staff-payload/chunk-* | base64 -d | tar -xJ
          test -s staff-prototype/index.html
          test -s staff-prototype/app.js
          test -s staff-prototype/styles.css
          test -s staff-prototype/browser.spec.cjs
          node --check staff-prototype/app.js
          node --test staff-prototype/test.cjs
          git rm -rf staff-payload
          git add staff-prototype
          git -c user.name='careflow-showcase-bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(staff): build eight CareFlow desktop portfolio surfaces'
          git push origin HEAD:design/careflow-clinic-core-8-portfolio
