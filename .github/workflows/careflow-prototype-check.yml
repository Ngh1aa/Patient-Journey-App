name: CareFlow state contract checks
on:
  push:
    branches:
      - design/careflow-lowfi-23-screens
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/careflow-prototype-check.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run patient journey state contract tests
        run: node prototype/tests.cjs
